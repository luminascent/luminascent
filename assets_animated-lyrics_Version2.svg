<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 800 120" width="800" height="120" role="img" aria-label="Animated colorful lyrics">
  <title>Animated colorful lyrics</title>

  <defs>
    <!-- Moving gradient: animate the gradientTransform for a sliding color effect -->
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" x2="800" y1="0" y2="0">
      <stop offset="0%"  stop-color="#ff4d4f"/>
      <stop offset="25%" stop-color="#ffa940"/>
      <stop offset="50%" stop-color="#fadb14"/>
      <stop offset="75%" stop-color="#73d13d"/>
      <stop offset="100%" stop-color="#40a9ff"/>
      <!-- Slide the gradient horizontally -->
      <animateTransform attributeName="gradientTransform"
                        type="translate"
                        from="-800 0"
                        to="800 0"
                        dur="6s"
                        repeatCount="indefinite" />
    </linearGradient>

    <!-- Slight blur/glow for nicer appearance (kept subtle) -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0b0b0b" />

  <!-- Main animated text -->
  <text x="50%" y="60%" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial"
        font-size="36" font-weight="700"
        fill="url(#g)" filter="url(#glow)">
    rather suffering in silence than suffering with you.
  </text>

  <!-- Static fallback (visible in viewers that don't play SMIL) -->
  <g aria-hidden="true">
    <text x="50%" y="60%" text-anchor="middle"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial"
          font-size="36" font-weight="700"
          fill="#ffd" style="display:none;">
      Your moving lyric line goes here
    </text>
  </g>
</svg>